[project]
name = "gamegate"
version = "0.1.0"
description = "Detects gaming sessions, holds non-urgent Gmail/Slack/Discord messages, and delivers a post-game digest."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "httpx>=0.28",
]

[project.optional-dependencies]
discord = ["discord.py>=2.7"]
agent = ["psutil>=5.9", "pystray>=0.19", "pillow>=10", "pywebview>=5"]
gmail = ["google-api-python-client>=2.100", "google-auth-oauthlib>=1.1"]
slack = ["slack-sdk>=3.27"]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "httpx>=0.28",
    "ruff>=0.16",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
