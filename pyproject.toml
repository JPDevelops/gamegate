[project]
name = "gamegate"
version = "0.1.0"
description = "Detects gaming sessions, holds non-urgent Gmail/Slack/Discord messages, and delivers a post-game digest."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "httpx>=0.28",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
discord = ["discord.py>=2.7"]
agent = ["psutil>=5.9", "pystray>=0.19", "pillow>=10", "pywebview>=5"]
gmail = ["google-api-python-client>=2.100", "google-auth-oauthlib>=1.1"]
slack = ["slack-sdk>=3.27"]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "httpx>=0.28",
    "ruff>=0.16",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# A real rule set, not just the default E4/E7/E9/F. Catches line length,
# import hygiene, bugbears, comprehensions, and modernizations — the classes
# the adversarial review flagged as "generated, not written" tells.
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
# UP042 (str, Enum -> StrEnum) is skipped deliberately: our enums are
# serialized by .value and StrEnum changes str() semantics; not worth the risk.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures carry realistic long Windows path literals and descriptive
# signatures; line length is enforced on app/ and agent/, not test data.
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
