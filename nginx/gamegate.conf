# GameGate reverse proxy — plain HTTP :80 (runbook Step 11).
# Nginx is the only thing listening on the network; Uvicorn stays on
# 127.0.0.1:8000. TLS is served by nginx/gamegate-tls.conf (listen 443, live
# via Let's Encrypt); this :80 block stays up for existing plain-HTTP lab
# clients on the LAN.
#
# Install: sudo cp nginx/gamegate.conf /etc/nginx/sites-available/gamegate
#          sudo ln -s /etc/nginx/sites-available/gamegate /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

# Strip query strings from the access log so /app?key=<token> never writes the
# token to disk in plaintext (review finding M10).
log_format gamegate_noargs '$remote_addr - $remote_user [$time_local] '
                           '"$request_method $uri $server_protocol" $status '
                           '$body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/gamegate.access.log gamegate_noargs;

    # Events/status payloads are small; reject anything absurd at the door.
    client_max_body_size 64k;

    server_tokens off;                       # hide nginx version banner
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite: don't trust client XFF
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
