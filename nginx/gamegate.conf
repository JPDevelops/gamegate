# GameGate reverse proxy (runbook Step 11).
# Nginx is the only thing listening on the network; Uvicorn stays on
# 127.0.0.1:8000. TLS termination belongs HERE (listen 443 ssl + certs)
# if the service is ever exposed beyond the LAN — not in FastAPI.
#
# Install: sudo cp nginx/gamegate.conf /etc/nginx/sites-available/gamegate
#          sudo ln -s /etc/nginx/sites-available/gamegate /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;

    # Events/status payloads are small; reject anything absurd at the door.
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
