# GameGate :80 vhost — redirect-only (runbook Step 11).
# The authenticated API must not be served over cleartext on a public host:
# tokens, cookies, and the ?key= login URL would traverse the network in the
# clear (review B2). So :80 does nothing but answer ACME challenges and 301
# every other request to HTTPS (nginx/gamegate-tls.conf). Uvicorn stays on
# 127.0.0.1:8000; TLS terminates at the 443 vhost.
#
# NOTE: clients (detector/connectors) must point at the https:// URL. Update
# agent/config.json's api_url to https before switching :80 to redirect on a
# live box, or the detector's POSTs will hit the 301 and drop.
#
# Install: sudo cp nginx/gamegate.conf /etc/nginx/sites-available/gamegate
#          sudo cp nginx/gamegate-log.conf /etc/nginx/conf.d/gamegate-log.conf
#          sudo ln -s /etc/nginx/sites-available/gamegate /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/gamegate.access.log gamegate_noargs;
    server_tokens off;

    # Let certbot renew over HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
