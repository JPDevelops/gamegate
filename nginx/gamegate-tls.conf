# GameGate HTTPS endpoint (Let's Encrypt via sslip.io). This is the config the
# live server runs; committing it keeps the repo honest about the deployment.
# Port 80 (gamegate.conf) stays up for existing plain-HTTP lab clients on the
# LAN; migration off HTTP is tracked in docs/SECURITY_DISPOSITIONS.md (#26).
#
# Install:
#   sudo cp nginx/gamegate-tls.conf /etc/nginx/sites-available/gamegate-tls
#   sudo ln -s /etc/nginx/sites-available/gamegate-tls /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# (certs are provisioned separately by certbot for your own hostname.)

# The gamegate_noargs log format (keeps the ?key= token out of the log, M10) is
# defined once in nginx/gamegate-log.conf → /etc/nginx/conf.d/, shared by both
# server blocks; this file just references it via access_log below.

server {
    listen 443 ssl;
    server_name YOUR-HOST.sslip.io;      # set to your own sslip.io hostname
    server_tokens off;

    access_log /var/log/nginx/gamegate.access.log gamegate_noargs;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    ssl_certificate     /etc/letsencrypt/live/YOUR-HOST.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR-HOST.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64k;

    # Public marketing site.
    location /site/ {
        alias /home/ubuntu/Project/site-preview/;
        index index.html;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite: don't trust client XFF
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
