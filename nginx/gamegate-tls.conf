# GameGate HTTPS endpoint (Let's Encrypt via sslip.io). This is the config the
# live server runs; committing it keeps the repo honest about the deployment.
# Port 80 (gamegate.conf) serves no plain-HTTP API — it only answers ACME
# challenges and 301-redirects everything else here to HTTPS (see #26 in
# docs/SECURITY_DISPOSITIONS.md).
#
# Install:
#   sudo cp nginx/gamegate-tls.conf /etc/nginx/sites-available/gamegate-tls
#   sudo ln -s /etc/nginx/sites-available/gamegate-tls /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# (certs are provisioned separately by certbot for your own hostname.)

# The gamegate_noargs log format (keeps the ?key= token out of the log, M10) is
# defined once in nginx/gamegate-log.conf → /etc/nginx/conf.d/, shared by both
# server blocks; this file just references it via access_log below.

server {
    listen 443 ssl;
    server_name YOUR-HOST.sslip.io;      # set to your own sslip.io hostname
    server_tokens off;

    access_log /var/log/nginx/gamegate.access.log gamegate_noargs;

    # No server-level add_header on purpose: proxied app responses already carry
    # the full security-header set from SecurityHeadersMiddleware, and the static
    # /site/ location sets its own complete set below. A server-level block here
    # would just duplicate three headers on every proxied response (review
    # NITPICK: duplicate headers), and because nginx add_header inheritance is
    # all-or-nothing it would also strip the app's extra headers from anywhere
    # that redeclared them.

    ssl_certificate     /etc/letsencrypt/live/YOUR-HOST.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR-HOST.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64k;

    # Public marketing site. Static files bypass the FastAPI app, so its
    # SecurityHeadersMiddleware never runs here — the full header set (incl.
    # HSTS, CSP, Permissions-Policy) is repeated at this location. nginx
    # add_header inheritance is all-or-nothing per level, so once this block
    # sets any header it must set them all (review MINOR: static headers).
    location /site/ {
        alias /home/ubuntu/Project/site-preview/;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite: don't trust client XFF
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
