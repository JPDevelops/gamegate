# Install to /etc/nginx/conf.d/gamegate-log.conf (loaded at http level, before
# the sites). Defines the access-log format ONCE for both GameGate server
# blocks; logging $uri instead of $request keeps the /app?key=<token> login
# token out of the access log (review finding M10).
log_format gamegate_noargs '$remote_addr - $remote_user [$time_local] '
                           '"$request_method $uri $server_protocol" $status '
                           '$body_bytes_sent "$http_referer" "$http_user_agent"';
