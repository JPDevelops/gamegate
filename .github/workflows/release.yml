name: Build Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      # Gate the release on the test suite — never ship an untested binary
      # (the whole reason an old vulnerable build was the download; review B1).
      - name: Test gate
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest httpx ruff
          ruff check app tests agent
          pytest -q
      # Server deps (fastapi, uvicorn, httpx, python-dotenv) already came from
      # `pip install -e .` in the test gate; add the desktop/GUI libs here. No
      # winsdk anymore — notification capture reads wpndatabase.db directly.
      - name: Install build deps
        run: pip install pyinstaller psutil pystray pillow pywebview winotify
        working-directory: agent
      - name: Stamp build
        shell: pwsh
        run: |
          $hash = git rev-parse --short HEAD
          $stamp = Get-Date -Format "MMM d HH:mm"
          "{`"build`": `"$hash`", `"built`": `"$stamp`"}" | Out-File -Encoding ascii agent/build_info.json
      - name: Build GameGate.exe
        # Build via the spec so the embedded FastAPI server (../app) + dashboard
        # template + uvicorn submodules are bundled — that's what makes the
        # downloaded exe run standalone (local mode). The spec also bundles
        # build_info.json when present (stamped above).
        run: pyinstaller GameGate.spec
        working-directory: agent
      - name: Upload artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: GameGate-exe
          path: agent/dist/GameGate.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: agent/dist/GameGate.exe
