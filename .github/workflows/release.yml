name: Build Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      # Gate the release on the test suite — never ship an untested binary
      # (the whole reason an old vulnerable build was the download; review B1).
      - name: Test gate
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest httpx ruff
          ruff check app tests agent
          pytest -q
      # Server deps (fastapi, uvicorn, httpx, python-dotenv) already came from
      # `pip install -e .` in the test gate; add the desktop/GUI libs here. No
      # winsdk anymore — notification capture reads wpndatabase.db directly.
      - name: Install build deps
        run: pip install pyinstaller psutil pystray pillow pywebview winotify
        working-directory: agent
      - name: Stamp build
        shell: pwsh
        run: |
          $hash = git rev-parse --short HEAD
          $stamp = Get-Date -Format "MMM d HH:mm"
          "{`"build`": `"$hash`", `"built`": `"$stamp`"}" | Out-File -Encoding ascii agent/build_info.json
      - name: Build GameGate.exe
        # Build via the spec so the embedded FastAPI server (../app) + dashboard
        # template + uvicorn submodules are bundled — that's what makes the
        # downloaded exe run standalone (local mode). The spec also bundles
        # build_info.json when present (stamped above).
        run: pyinstaller GameGate.spec
        working-directory: agent
      - name: Build installer (GameGateSetup.exe)
        # Wrap GameGate.exe in the Inno Setup wizard (welcome → consent →
        # progress → finish; per-user, no admin). Inno Setup ships on the GitHub
        # windows runner, but install it if missing to be safe.
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          Copy-Item agent/dist/GameGate.exe packaging/installer/GameGate.exe -Force
          & $iscc packaging/installer/GameGate.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compile failed" }
      - name: Upload artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: GameGate-exe
          path: |
            agent/dist/GameGate.exe
            packaging/installer/out/GameGateSetup.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            agent/dist/GameGate.exe
            packaging/installer/out/GameGateSetup.exe
