name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the checked-out code. Denies a
# compromised dependency/action the write scope to push commits or releases.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          # Pin the test/lint toolchain so a new pytest/ruff release can't turn
          # this check red (or green) for the same commit (review: reproducibility).
          pip install pytest==9.1.1 httpx==0.28.1 ruff==0.16.4
      - name: Lint
        run: ruff check app tests agent
      - name: Test
        run: pytest -q

  secret-scan:
    # Turns "no secrets in the repo/history" from an assertion into a check that
    # runs on every push and PR (review MAJOR: unverifiable security claims).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # full history so the scan covers every commit, all branches
      - name: Install gitleaks
        run: |
          # Pin the version AND verify its sha256 before executing it — an
          # unverified download of a binary we then run is its own supply-chain
          # hole (review MAJOR: verify the gitleaks archive).
          TARBALL=gitleaks_8.21.2_linux_x64.tar.gz
          SHA=5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
          curl -sSL -o "$TARBALL" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/$TARBALL"
          echo "$SHA  $TARBALL" | sha256sum -c -
          tar -xzf "$TARBALL" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Scan full git history for secrets
        run: gitleaks detect --source . --redact --verbose
