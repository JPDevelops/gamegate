name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the checked-out code. Denies a
# compromised dependency/action the write scope to push commits or releases.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest httpx ruff
      - name: Lint
        run: ruff check app tests agent
      - name: Test
        run: pytest -q
