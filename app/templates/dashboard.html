<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameGate</title>
<style>
  :root {
    /* Guardian: near-black, signal green means 'protected'. Color is rationed. */
    --bg-side:#0a0c0d; --bg-app:#0e1011; --bg-card:#15181a; --bg-hover:#1b1f21;
    --bg-inset:#090b0c; --line:#242a2c; --line-soft:#1b2022;
    --text:#e7eae8; --text-dim:#b7bdb9; --muted:#7e8681;
    --accent:#2ee06f; --accent-soft:#2ee06f14; --accent2:#4ae584;
    --green:#2ee06f; --red:#e5484d; --amber:#f5a524;
    --radius:10px; --radius-lg:14px;
  }
  body.light {
    --bg-side:#eef1ef; --bg-app:#f7f9f8; --bg-card:#ffffff; --bg-hover:#edf1ee;
    --bg-inset:#eef1ef; --line:#d7ddd9; --line-soft:#e3e8e4;
    --text:#171b18; --text-dim:#3a403c; --muted:#68706b;
    --accent:#149648; --accent-soft:#14964812; --accent2:#0f7d3c;
  }
  * { margin:0; padding:0; box-sizing:border-box; scrollbar-width:none; }
  *::-webkit-scrollbar { width:0; height:0; }
  html, body { height:100%; }
  body { background:var(--bg-app); color:var(--text);
         font:14px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
         display:grid; grid-template-columns:224px 1fr; grid-template-rows:100%; overflow:hidden; }

  /* ── sidebar ─────────────────────────────────────────────── */
  aside { background:var(--bg-side); border-right:1px solid var(--line-soft);
          display:flex; flex-direction:column; min-height:0; }
  .brand { display:flex; align-items:center; gap:10px; padding:18px 16px 14px; }
  .brand .mark { width:30px; height:30px; border-radius:9px; background:var(--bg-card);
                 display:grid; place-items:center; flex:none;
                 box-shadow:inset 0 0 0 1px var(--line-soft); }
  .brand .mark::after { content:""; width:13px; height:13px; border-radius:50%;
                        border:3.5px solid var(--accent); }
  .brand .word { font-size:14px; font-weight:700; letter-spacing:.14em; }
  nav { padding:6px 10px; display:flex; flex-direction:column; gap:2px; }
  nav a { display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:8px;
          color:var(--muted); text-decoration:none; font-weight:500; font-size:13.5px;
          transition:background .12s, color .12s; }
  nav a svg { width:17px; height:17px; flex:none; }
  nav a:hover { background:var(--bg-hover); color:var(--text-dim); }
  nav a.active { background:var(--accent-soft); color:var(--accent2); }
  nav a .navbadge { margin-left:auto; background:var(--red); color:#fff;
                    border-radius:99px; font-size:10.5px; font-weight:600; padding:1px 7px; }
  .side-footer { margin-top:auto; padding:12px; }
  .status-card { background:var(--bg-card); border:1px solid var(--line-soft);
                 border-radius:var(--radius); padding:10px 12px; display:flex;
                 align-items:center; gap:9px; }
  .status-card .dot { width:9px; height:9px; border-radius:50%; background:var(--muted); flex:none; }
  .status-card.gaming .dot { background:var(--green); box-shadow:0 0 8px var(--green); }
  .status-card.focused .dot { background:var(--red); }
  .status-card .lbl { min-width:0; }
  .status-card .lbl b { display:block; font-size:12.5px; font-weight:600;
                        white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .status-card .lbl span { font-size:11px; color:var(--muted); }
  .side-version { text-align:center; color:var(--muted); font-size:10.5px; padding-top:8px; }

  /* ── topbar + content ────────────────────────────────────── */
  .main { display:flex; flex-direction:column; min-width:0; min-height:0; }
  .topbar { display:flex; align-items:center; gap:10px; height:48px; flex:none;
            padding:0 10px 0 22px; border-bottom:1px solid var(--line-soft); }
  .topbar h1 { font-size:15.5px; font-weight:600; letter-spacing:.01em; }
  .topbar .crumb { color:var(--muted); font-weight:400; }
  #win-controls { display:none; gap:2px; margin-left:auto; }
  #win-controls button { background:none; border:none; color:var(--muted); font-size:14px;
                         width:38px; height:32px; border-radius:7px; cursor:pointer; }
  #win-controls button:hover { background:var(--bg-hover); color:var(--text); }
  #win-controls .close:hover { background:var(--red); color:#fff; }
  .content { overflow-y:auto; padding:22px 26px 64px; }
  .content-inner { max-width:780px; margin:0 auto; }

  /* ── shared components ───────────────────────────────────── */
  .card { background:var(--bg-card); border:1px solid var(--line-soft);
          border-radius:var(--radius); padding:14px 16px; margin-bottom:10px; }
  .card.click { cursor:pointer; transition:background .12s, border-color .12s; }
  .card.click:hover { background:var(--bg-hover); border-color:var(--line); }
  .row { display:flex; align-items:center; gap:12px; }
  .muted { color:var(--muted); font-size:12.5px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 16px; }
  .section-title { font-size:11px; letter-spacing:.09em; color:var(--muted); font-weight:600;
                   text-transform:uppercase; margin:24px 0 10px; }
  .section-title:first-child { margin-top:0; }
  .section-title.urgent { color:var(--red); }
  .section-title.action { color:var(--amber); }
  .chip { font-size:10.5px; font-weight:600; padding:3px 9px; border-radius:5px;
          border:1px solid var(--line); color:var(--muted);
          text-transform:uppercase; letter-spacing:.05em; flex:none; }
  .chip.urgent { color:#fff; background:var(--red); border-color:var(--red); }
  .chip.actionable { color:#241a00; background:var(--amber); border-color:var(--amber); }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--muted); flex:none; }
  .dot.ok { background:var(--green); } .dot.warn { background:var(--amber); }
  .dot.off { background:var(--line); }
  .btn { background:var(--accent); border:none; color:#06130b; border-radius:8px; height:32px;
         padding:0 15px; font:inherit; font-size:13px; font-weight:600; cursor:pointer;
         text-decoration:none; display:inline-flex; align-items:center; }
  .btn:hover { filter:brightness(1.1); }
  .btn.danger { background:var(--red); color:#fff; }
  .btn.green { background:var(--green); }
  .empty { text-align:center; color:var(--muted); padding:64px 16px; font-size:13.5px; }
  .empty svg { width:36px; height:36px; margin-bottom:12px; opacity:.5; }

  /* messages */
  .filter-bar { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
  .fchip { background:var(--bg-card); border:1px solid var(--line-soft); border-radius:7px;
           padding:6px 12px; font-size:12.5px; font-weight:500; color:var(--muted); cursor:pointer;
           transition:background .12s, color .12s; }
  .fchip:hover { background:var(--bg-hover); }
  .fchip.on { color:var(--accent2); border-color:var(--accent); background:var(--accent-soft); }
  .fchip b { color:var(--accent2); font-weight:600; }
  .readbtn { background:none; border:1px solid var(--line); color:var(--muted);
             border-radius:7px; height:28px; padding:0 11px; font:inherit; font-size:12px;
             cursor:pointer; margin-left:auto; flex:none; transition:all .12s; }
  .readbtn:hover { border-color:var(--green); color:var(--green); }
  .undo-pill { background:var(--accent-soft); border:1px solid var(--accent); color:var(--accent2);
               border-radius:7px; padding:6px 12px; font-size:12.5px; cursor:pointer; }
  .msg-title { font-size:13.5px; font-weight:500; }

  /* recaps */
  .recap-card { display:flex; align-items:center; gap:14px; padding:12px 14px; }
  .art { width:106px; height:50px; border-radius:7px; object-fit:cover; flex:none;
         background:var(--bg-inset); }
  .recap-game { font-size:15px; font-weight:600; }
  .recap-duration { font-size:21px; font-weight:700; color:var(--text);
                    margin-left:auto; flex:none; font-variant-numeric:tabular-nums; }
  .back { color:var(--muted); text-decoration:none; font-size:12.5px; font-weight:500;
          display:inline-flex; align-items:center; gap:6px; margin-bottom:14px; }
  .back:hover { color:var(--accent2); }
  .hero { position:relative; border:1px solid var(--line-soft); border-radius:var(--radius-lg);
          overflow:hidden; margin-bottom:16px; background:var(--bg-card); }
  .hero-art-bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
                 opacity:.28; filter:blur(2px) saturate(1.1); }
  .hero-grad { position:absolute; inset:0;
               background:linear-gradient(180deg, transparent, var(--bg-card) 88%); }
  .hero-body { position:relative; padding:26px 24px 20px; }
  .hero .game { font-size:19px; font-weight:700; }
  .hero .dur { font-size:40px; font-weight:800; color:var(--text); line-height:1.15;
               font-variant-numeric:tabular-nums; }
  .hero .meta { color:var(--muted); margin-top:4px; font-size:12.5px; }
  .stat-row { display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
  .stat { background:var(--bg-inset); border:1px solid var(--line-soft); border-radius:9px;
          padding:9px 16px; text-align:center; min-width:86px; }
  .stat b { display:block; font-size:18px; font-variant-numeric:tabular-nums; }
  .stat span { font-size:10.5px; color:var(--muted); text-transform:uppercase;
               letter-spacing:.05em; font-weight:600; }

  /* connectors */
  .conn-actions { margin-top:12px; padding-top:12px; border-top:1px solid var(--line-soft);
                  display:flex; gap:8px; }
  .fab { position:fixed; right:26px; bottom:24px; background:var(--green); color:#06130b;
         border:none; border-radius:10px; height:40px; padding:0 18px; font:inherit;
         font-size:13.5px; font-weight:600; cursor:pointer; box-shadow:0 10px 28px #0007; z-index:9;
         display:inline-flex; align-items:center; gap:7px; }
  .fab:hover { filter:brightness(1.08); }
  .catalog-overlay { position:fixed; inset:0; background:#000a; z-index:10;
                     display:grid; place-items:center; }
  .catalog { background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius-lg);
             padding:20px; width:min(440px, 92vw); }
  .catalog h2 { font-size:15px; margin-bottom:12px; font-weight:600; }

  /* settings */
  .setrow { display:flex; align-items:center; gap:14px; padding:13px 2px;
            border-bottom:1px solid var(--line-soft); }
  .setrow:last-child { border-bottom:none; }
  .setrow .lbl { flex:1; min-width:0; }
  .setrow .lbl > div:first-child { font-size:13.5px; font-weight:500; }
  .setrow .lbl .muted { font-size:12px; margin-top:1px; }
  .switch { width:42px; height:23px; border-radius:99px; background:var(--line);
            position:relative; cursor:pointer; flex:none; transition:background .15s; }
  .switch::after { content:""; position:absolute; top:2.5px; left:3px; width:18px; height:18px;
                   border-radius:50%; background:#fff; transition:left .15s;
                   box-shadow:0 1px 3px #0006; }
  .switch.on { background:var(--accent); }
  .switch.on::after { left:21px; }
  .setinput { background:var(--bg-inset); border:1px solid var(--line); color:var(--text);
              border-radius:8px; padding:8px 12px; font:inherit; font-size:13px; width:100%; }
  .setinput:focus { outline:none; border-color:var(--accent); }
  input.num { width:74px; text-align:center; }
  .danger-zone { border-color:color-mix(in srgb, var(--red) 45%, var(--line)); }

  @media (max-width: 680px) {
    body { grid-template-columns:64px 1fr; }
    .brand .word, nav a .txt, nav a .navbadge, .side-footer { display:none; }
    nav a { justify-content:center; padding:11px 0; }
    .content { padding:16px 14px 64px; }
  }
</style>
</head>
<body>
<aside>
  <div class="brand pywebview-drag-region"><div class="mark"></div><div class="word">GAMEGATE</div></div>
  <nav id="sidenav"></nav>
  <div class="side-footer">
    <div class="status-card" id="status-card">
      <span class="dot"></span>
      <div class="lbl"><b id="status-title">…</b><span id="status-sub">connecting</span></div>
    </div>
    <div class="side-version">GameGate v%%GAMEGATE_VERSION%%</div>
  </div>
</aside>
<div class="main">
  <div class="topbar pywebview-drag-region">
    <h1 id="page-title">Game Recaps</h1>
    <div id="win-controls">
      <button title="Minimize" onclick="pywebview.api.minimize()">—</button>
      <button class="close" title="Close" onclick="pywebview.api.close()">✕</button>
    </div>
  </div>
  <div class="content"><div class="content-inner" id="view"></div></div>
</div>
<script>
/* ── icon set (stroke, 24 viewbox) ─────────────────────────── */
const I = {
  recaps: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11h4M8 9v4"/><circle cx="16" cy="12" r="1"/><circle cx="18.5" cy="9.5" r="1"/><path d="M17.3 5H6.7a4.7 4.7 0 0 0-4.6 4L1 16.2A2.8 2.8 0 0 0 3.8 19c.9 0 1.8-.4 2.3-1.2L8 15.5h8l1.9 2.3c.5.8 1.4 1.2 2.3 1.2a2.8 2.8 0 0 0 2.8-2.8L21.9 9a4.7 4.7 0 0 0-4.6-4z"/></svg>',
  messages: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.7 4H7.3a2 2 0 0 0-1.8 1.1z"/></svg>',
  connectors: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7 7 9a4.2 4.2 0 0 0 0 6l2 2 8-8-2-2a4.2 4.2 0 0 0-6 0zM15 17l2-2M7 9 5 7M12 20l-1.5 1.5M20 12l1.5-1.5M3.5 22 6 19.5"/></svg>',
  settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.09a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.09a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>',
  inbox: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.7 4H7.3a2 2 0 0 0-1.8 1.1z"/></svg>',
  gamepad: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11h4M8 9v4"/><circle cx="16" cy="12" r="1"/><circle cx="18.5" cy="9.5" r="1"/><path d="M17.3 5H6.7a4.7 4.7 0 0 0-4.6 4L1 16.2A2.8 2.8 0 0 0 3.8 19c.9 0 1.8-.4 2.3-1.2L8 15.5h8l1.9 2.3c.5.8 1.4 1.2 2.3 1.2a2.8 2.8 0 0 0 2.8-2.8L21.9 9a4.7 4.7 0 0 0-4.6-4z"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="width:15px;height:15px"><path d="M12 5v14M5 12h14"/></svg>',
  mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="width:15px;height:15px;vertical-align:-3px"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>',
  chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="width:15px;height:15px;vertical-align:-3px"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.9-.9L3 20l1-4.9a8.4 8.4 0 1 1 17-3.6z"/></svg>',
  phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="width:15px;height:15px;vertical-align:-3px"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></svg>',
};
const SRCICON = { gmail: I.mail, discord: I.chat, slack: I.chat, text: I.phone, system: "" };

const NAVDEF = [
  { route: "recaps", label: "Game Recaps", icon: I.recaps, title: "Game Recaps" },
  { route: "messages", label: "Messages", icon: I.messages, title: "Messages" },
  { route: "connections", label: "Connectors", icon: I.connectors, title: "Connectors" },
  { route: "settings", label: "Settings", icon: I.settings, title: "Settings" },
];

const view = document.querySelector("#view");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago = (iso) => { const m = (Date.now() - new Date(iso)) / 60000;
  if (m < 1) return "just now"; if (m < 60) return Math.floor(m)+" min ago";
  if (m < 1440) return Math.floor(m/60)+" h ago";
  return new Date(iso).toLocaleDateString(undefined, {month:"short", day:"numeric"}); };
const fmtDur = (s) => { const m = Math.floor(s/60), h = Math.floor(m/60);
  return h ? h+"h "+String(m%60).padStart(2,"0")+"m" : m+"m "+String(s%60).padStart(2,"0")+"s"; };

let cache = { recaps: [], events: [], connections: null, status: null, userSettings: null };
let msgFilter = "all";
let msgView = "unread";
let undoIds = null;
if (localStorage.getItem("gg-theme") === "light") document.body.classList.add("light");

async function j(url) { const r = await fetch(url); if (!r.ok) throw new Error(r.status); return r.json(); }

function renderNav() {
  const unread = cache.events.filter(e => !e.read_at).length;
  const hash = location.hash || "#/recaps";
  const current = hash.split("/")[1] === "recap" ? "recaps" : hash.split("/")[1];
  document.querySelector("#sidenav").innerHTML = NAVDEF.map(n => `
    <a href="#/${n.route}" class="${current === n.route ? "active" : ""}">
      ${n.icon}<span class="txt">${n.label}</span>
      ${n.route === "messages" && unread ? `<span class="navbadge">${unread}</span>` : ""}
    </a>`).join("");
}

async function refresh() {
  try {
    [cache.status, cache.events, cache.recaps, cache.connections, cache.userSettings] =
      await Promise.all([
        j("/status"), j("/events?limit=100"), j("/digests?limit=20"),
        j("/connections"), j("/settings"),
      ]);
    const card = document.querySelector("#status-card");
    const state = cache.status.state;
    card.className = "status-card " + state;
    document.querySelector("#status-title").textContent =
      state === "gaming" ? (cache.status.application || "In game") : state === "focused" ? "Do Not Disturb" : "Available";
    document.querySelector("#status-sub").textContent =
      state === "gaming" ? "holding your messages" : state === "focused" ? "everything is held" : "delivering normally";
    renderNav();
  } catch (e) { /* session expired — views show their own message */ }
}

function recapCard(d) {
  const s = d.session || {};
  const actions = (d.action_required || []).length;
  const artEl = art(s, "art");
  return `<div class="card click recap-card" onclick="location.hash='#/recap/${esc(d.id)}'">
    ${artEl}
    <div style="min-width:0">
      <div class="recap-game">${esc(s.application || "Session")}</div>
      <div class="muted">${ago(d.created_at)} · ${d.total_events} message${d.total_events===1?"":"s"}${actions ? ` · <span style="color:var(--amber)">${actions} need action</span>` : ""}</div>
    </div>
    <div class="recap-duration">${s.duration_seconds != null ? fmtDur(s.duration_seconds) : ""}</div>
  </div>`;
}
const art = (s, cls) => {
  if (!s) return "";
  if (s.app_id) return `<img class="${cls}" src="https://cdn.cloudflare.steamstatic.com/steam/apps/${esc(s.app_id)}/header.jpg" onerror="this.remove()">`;
  if (s.application) return `<img class="${cls}" src="/art?game=${encodeURIComponent(s.application)}" onerror="this.remove()">`;
  return "";
};

const views = {
  recaps() {
    if (!cache.recaps.length) return `<div class="empty">${I.gamepad}<br>
      No recaps yet.<br>Finish a gaming session and your first Game Recap lands here.</div>`;
    return `<div class="sub">Your session summaries — what happened while you played.</div>`
      + cache.recaps.map(recapCard).join("");
  },
  recap(id) {
    const d = cache.recaps.find(x => x.id === id);
    if (!d) return `<a class="back" href="#/recaps">${I.back} All recaps</a><div class="empty">Recap not found.</div>`;
    const s = d.session || {};
    const counts = d.counts_by_priority || {};
    const items = d.items || [];
    const actions = d.action_required || [];
    const bgArt = s.app_id
      ? `<img class="hero-art-bg" src="https://cdn.cloudflare.steamstatic.com/steam/apps/${esc(s.app_id)}/header.jpg" onerror="this.remove()">`
      : (s.application ? `<img class="hero-art-bg" src="/art?game=${encodeURIComponent(s.application)}" onerror="this.remove()">` : "");
    const msgCard = (i) => `
      <div class="card row"><span class="chip ${esc(i.priority)}">${esc(i.priority)}</span>
        <div style="min-width:0"><div class="msg-title">${esc(i.sender)} — ${esc(i.title)}</div>
        <div class="muted">${SRCICON[i.source]||""} ${esc(i.source)} · ${ago(i.received_at)}</div></div></div>`;
    return `<a class="back" href="#/recaps">${I.back} All recaps</a>
    <div class="hero">
      ${bgArt}<div class="hero-grad"></div>
      <div class="hero-body">
        <div class="game">${esc(s.application || "Session")}</div>
        <div class="dur">${s.duration_seconds != null ? fmtDur(s.duration_seconds) : "—"}</div>
        <div class="meta">${s.started_at ? new Date(s.started_at).toLocaleString() : ""} · ${ago(d.created_at)}</div>
        <div class="stat-row">
          <div class="stat"><b>${d.total_events}</b><span>held</span></div>
          <div class="stat"><b>${counts.urgent ?? 0}</b><span>urgent</span></div>
          <div class="stat"><b>${counts.actionable ?? 0}</b><span>actionable</span></div>
          <div class="stat"><b>${actions.length}</b><span>need action</span></div>
        </div>
      </div>
    </div>
    ${actions.length ? `<div class="section-title action">Needs your action</div>` + actions.map(msgCard).join("") : ""}
    <div class="section-title">Everything from this session</div>
    ${items.length ? items.map(msgCard).join("") : `<div class="empty">A quiet session — nothing came in.</div>`}`;
  },
  messages() {
    const all = cache.events;
    const sources = [...new Set(all.map(e => e.source))];
    const unreadBy = (src) => all.filter(e => !e.read_at && (src === "all" || e.source === src)).length;
    const readCount = all.filter(e => e.read_at).length;
    const chips = ["all", ...sources].map(s => `
      <span class="fchip ${msgFilter === s ? "on" : ""}" onclick="msgFilter='${s}';route()">
        ${s === "all" ? "All" : esc(s)} ${unreadBy(s) ? `<b>${unreadBy(s)}</b>` : ""}
      </span>`).join("");
    const bar = `<div class="filter-bar">
      <span class="fchip ${msgView === "unread" ? "on" : ""}" onclick="msgView='unread';route()">Unread</span>
      <span class="fchip ${msgView === "read" ? "on" : ""}" onclick="msgView='read';route()">Read ${readCount ? `<b>${readCount}</b>` : ""}</span>
      <span style="width:10px"></span>${chips}
      <span style="margin-left:auto"></span>
      ${msgView === "unread" ? (undoIds ? `<span class="undo-pill" onclick="undoReadAll()">↩ Undo read all</span>`
                : `<span class="fchip" onclick="readAll()">Read all</span>`) : ""}
    </div>`;

    let shown = all.filter(e => msgFilter === "all" || e.source === msgFilter);
    shown = shown.filter(e => msgView === "read" ? e.read_at : !e.read_at);
    if (!shown.length) return bar + `<div class="empty">${I.inbox}<br>
      ${msgView === "read" ? "Nothing read yet." : "All caught up — nothing unread."}</div>`;

    const card = (e) => {
      const ai = e.metadata && e.metadata.ai;
      const aiLine = ai && ai.summary
        ? `<div class="muted" style="margin-top:3px;color:var(--green,#2ee06f)">🤖 ${esc(ai.summary)}${ai.urgency ? " · urgency " + esc(String(ai.urgency)) + "/10" : ""}</div>`
        : "";
      return `
      <div class="card row">
        <span class="chip ${esc(e.priority)}">${esc(e.priority)}</span>
        <div style="min-width:0"><div class="msg-title">${esc(e.sender)} — ${esc(e.title)}</div>
        <div class="muted">${SRCICON[e.source]||""} ${esc(e.source)} · ${ago(e.received_at)}</div>${aiLine}</div>
        ${e.read_at
          ? `<button class="readbtn" onclick="markRead('${e.id}', false)">Mark unread</button>`
          : `<button class="readbtn" onclick="markRead('${e.id}', true)">✓ Read</button>`}
      </div>`;
    };
    if (msgView === "read") return bar + shown.map(card).join("");
    const section = (title, cls, items) => items.length
      ? `<div class="section-title ${cls}">${title}</div>` + items.map(card).join("") : "";
    return bar
      + section("Urgent", "urgent", shown.filter(e => e.priority === "urgent"))
      + section("Needs action", "action", shown.filter(e => e.priority === "actionable"))
      + section("Everything else", "", shown.filter(e => !["urgent","actionable"].includes(e.priority)));
  },
  connections() {
    const c = cache.connections;
    if (!c) return `<div class="empty">Session expired — reopen your dashboard link.</div>`;
    const conn = (id, name, s) => `
      <div class="card click" onclick="toggleConn('${esc(id)}')">
        <div class="row">
          <span class="dot ${s.state === "connected" ? "ok" : s.state === "needs setup" ? "warn" : "off"}"></span>
          <div><div style="font-weight:600;font-size:13.5px">${esc(name)}</div><div class="muted">${esc(s.detail)}</div></div>
          ${s.action ? `<a class="btn" style="margin-left:auto" href="${esc(s.action.href)}" onclick="event.stopPropagation()">${esc(s.action.label)}</a>` : ""}
        </div>
        <div class="conn-actions" id="acts-${id}" hidden>
          ${s.can_disconnect ? `<button class="btn danger" onclick="event.stopPropagation();connAction('${id}','disconnect')">Disconnect</button>` : ""}
          ${s.can_connect ? `<button class="btn green" onclick="event.stopPropagation();connAction('${id}','connect')">${esc(s.connect_label || "Connect")}</button>` : ""}
          ${!s.can_disconnect && !s.can_connect ? `<span class="muted">No actions available</span>` : ""}
        </div>
      </div>`;
    return `<div class="sub">Click a connector to manage it.</div>`
      + conn("discord", "Discord", c.discord) + conn("gmail", "Gmail", c.gmail)
      + (c.text ? conn("text", "Text Messages", c.text) : "")
      + conn("slack", "Slack", c.slack) + conn("classifier", "AI classifier", c.classifier)
      + `<button class="fab" onclick="showCatalog()">${I.plus} Add a connector</button>`;
  },
  settings() {
    const s = cache.userSettings;
    if (!s) return `<div class="empty">Loading…</div>`;
    const sw = (key, label, hint) => `
      <div class="setrow"><div class="lbl"><div>${label}</div><div class="muted">${hint}</div></div>
        <div class="switch ${s[key] ? "on" : ""}" onclick="setSetting('${key}', ${!s[key]})"></div></div>`;
    const dark = !document.body.classList.contains("light");
    const agent = (cache.connections && cache.connections.agent) || {};
    const pending = agent.pending;
    let appStatus, appMuted;
    if (pending == null) { appStatus = "Checking for updates…"; appMuted = true; }
    else if (pending > 0) {
      appStatus = `Update available (${pending}) — use “Update GameGate” in the tray menu`; appMuted = false;
    } else { appStatus = "Latest version"; appMuted = true; }
    return `
    <div class="section-title">App</div>
    <div class="card">
      <div class="setrow"><div class="lbl"><div>GameGate desktop app</div>
        <div class="${appMuted ? "muted" : ""}" style="${appMuted ? "" : "color:var(--amber);font-weight:600"}">${esc(appStatus)}${agent.build ? " · build " + esc(agent.build) : ""}</div></div></div>
    </div>
    <div class="section-title">Notifications</div>
    <div class="card">
      ${sw("urgent_breakthrough", "Urgent break-through while gaming",
           "Truly urgent messages pop the overlay mid-game. Off = everything waits for the recap.")}
      ${sw("notification_sound", "Notification sound", "Play a sound when the overlay appears.")}
      <div class="setrow"><div class="lbl"><div>Overlay duration</div>
        <div class="muted">Seconds the card stays on screen (4–20).</div></div>
        <input class="setinput num" type="number" min="4" max="20" value="${s.overlay_duration_s}"
          onchange="setSetting('overlay_duration_s', parseInt(this.value)||8)"></div>
    </div>
    <div class="section-title">Do Not Disturb</div>
    <div class="card">
      <div class="setrow"><div class="lbl"><div>Do Not Disturb</div>
        <div class="muted">Hold everything (like gaming, but manual). Wins over auto-detection until you turn it off. Currently: <b>${cache.status && cache.status.manual_override ? "ON" : "off"}</b></div></div>
        <div class="switch ${cache.status && cache.status.manual_override ? "on" : ""}" onclick="toggleDnd()"></div></div>
    </div>
    <div class="section-title">Rules</div>
    <div class="card">
      <div class="setrow"><div class="lbl"><div>VIP senders</div>
        <div class="muted">Messages from these emails always break through. Comma-separated.</div>
        <input class="setinput" style="margin-top:8px" value="${esc(s.vip_senders.join(", "))}"
          onchange="setSetting('vip_senders', this.value.split(',').map(x=>x.trim()).filter(Boolean))"></div></div>
      <div class="setrow"><div class="lbl"><div>Urgent keywords</div>
        <div class="muted">Any message containing these words is treated urgent.</div>
        <input class="setinput" style="margin-top:8px" value="${esc(s.urgent_keywords.join(", "))}"
          onchange="setSetting('urgent_keywords', this.value.split(',').map(x=>x.trim()).filter(Boolean))"></div></div>
    </div>
    <div class="section-title">Appearance</div>
    <div class="card">
      <div class="setrow"><div class="lbl"><div>Dark mode</div>
        <div class="muted">This device only.</div></div>
        <div class="switch ${dark ? "on" : ""}" onclick="toggleTheme()"></div></div>
    </div>
    <div class="section-title">Danger zone</div>
    <div class="card danger-zone">
      <div class="setrow"><div class="lbl"><div>Clear message data</div>
        <div class="muted">Deletes all messages, recaps, and sessions. Settings and connections survive. Cannot be undone.</div></div>
        <button class="btn danger" onclick="clearData()">Clear…</button></div>
    </div>`;
  },
};

async function setSetting(key, value) {
  const r = await fetch("/settings", { method: "PUT",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify({ [key]: value }) });
  if (!r.ok) { const b = await r.json().catch(() => ({})); alert(b.detail || "Invalid value"); }
  await refresh(); route();
}
async function toggleDnd() {
  // DND is a manual override the detector can't overwrite (owner decision: the
  // dashboard wins). It stays on until turned off here, regardless of gaming.
  const on = cache.status && cache.status.manual_override;
  await fetch("/status/dnd", { method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ enabled: !on }) });
  await refresh(); route();
}
function toggleTheme() {
  document.body.classList.toggle("light");
  localStorage.setItem("gg-theme", document.body.classList.contains("light") ? "light" : "dark");
  route();
}
async function clearData() {
  const typed = prompt('This deletes ALL messages, recaps, and sessions. Type DELETE to confirm:');
  if (typed !== "DELETE") return;
  await fetch("/data/clear", { method: "POST",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify({ confirm: "DELETE" }) });
  await refresh(); route();
}
async function markRead(id, read) {
  await fetch(`/events/${id}/${read ? "read" : "unread"}`, { method: "POST" });
  await refresh(); route();
}
async function readAll() {
  const r = await fetch("/events/read-all", { method: "POST" });
  const body = await r.json().catch(() => ({}));
  undoIds = body.marked && body.marked.length ? body.marked : null;
  await refresh(); route();
  setTimeout(() => { undoIds = null; if (location.hash.includes("messages")) route(); }, 12000);
}
async function undoReadAll() {
  if (undoIds) await fetch("/events/unread", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ids: undoIds }),
  });
  undoIds = null;
  await refresh(); route();
}
function toggleConn(id) {
  const el = document.querySelector("#acts-" + id);
  if (el) el.hidden = !el.hidden;
}
async function connAction(id, action) {
  // The AI classifier needs a key, so its "Connect" opens a key pop-up instead
  // of the plain connector toggle; "Disconnect" just turns AI off.
  if (id === "classifier") {
    if (action === "connect") { showAiKeyModal(); return; }
    const r = await fetch("/settings/classifier", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ enabled: false }) });
    if (!r.ok) alert("Couldn't turn the AI off.");
    setTimeout(async () => { await refresh(); route(); }, 400);
    return;
  }
  // Gmail (local IMAP path only — the cloud OAuth path keeps its own link/flow):
  // "Connect" opens an address + app-password pop-up; "Disconnect" just turns
  // polling off (the saved app password stays so re-enabling is one click).
  if (id === "gmail" && cache.connections?.gmail?.kind === "imap") {
    if (action === "connect") { showGmailModal(); return; }
    const r = await fetch("/settings/gmail", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ enabled: false }) });
    if (!r.ok) alert("Couldn't turn Gmail off.");
    setTimeout(async () => { await refresh(); route(); }, 400);
    return;
  }
  // Text messages: "Sync text messages" opens the Phone Link walkthrough;
  // there's no credential — Disconnect just flips the presentational flag
  // (the phone stays paired in Phone Link), so we confirm that it's a mute.
  if (id === "text" && cache.connections?.text?.kind === "textsync") {
    if (action === "connect") { showTextSyncWizard(cache.connections.text.resume_step || 1); return; }
    if (!confirm("Stop syncing texts?\n\nYour texts will stop showing up in GameGate. Your phone stays paired in Phone Link, and you can turn this back on any time.")) return;
    const r = await fetch("/settings/text-sync", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ enabled: false }) });
    if (!r.ok) alert("Couldn't update text sync.");
    setTimeout(async () => { await refresh(); route(); }, 400);
    return;
  }
  const r = await fetch(`/connectors/${id}/${action}`, { method: "POST" });
  const body = await r.json().catch(() => ({}));
  if (body.authorize) { location.href = body.authorize; return; }
  if (!r.ok) { alert(body.detail || "That didn't work."); }
  setTimeout(async () => { await refresh(); route(); }, 800);
}
function showAiKeyModal() {
  const overlay = document.createElement("div");
  overlay.className = "catalog-overlay";
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  const hasKey = cache.userSettings && cache.userSettings.classifier_api_key_set;
  overlay.innerHTML = `<div class="catalog">
    <h2>Connect AI Classifier</h2>
    <div class="muted" style="margin-bottom:12px">Paste your OpenAI API key. It's stored only on this PC and never shown again — only each notification's title and a short snippet are sent to OpenAI. Get a key at platform.openai.com → API keys.</div>
    <input id="aiKeyInput" class="setinput" type="password" autocomplete="off" style="width:100%"
      placeholder="${hasKey ? '•••••••• (saved — paste to replace)' : 'sk-...'}">
    <div id="aiKeyStatus" style="min-height:18px;margin-top:8px;font-size:13px"></div>
    <div class="row" style="justify-content:flex-end;gap:8px;margin-top:10px">
      <button class="btn" onclick="this.closest('.catalog-overlay').remove()">Cancel</button>
      <button class="btn green" id="aiSaveBtn" onclick="saveAiKey(this)">Save &amp; connect</button>
    </div></div>`;
  document.body.appendChild(overlay);
  const inp = overlay.querySelector("#aiKeyInput");
  if (inp) {
    inp.focus();
    // Enter submits; typing after an error clears the error so it isn't stale.
    inp.addEventListener("keydown", (ev) => { if (ev.key === "Enter") saveAiKey(overlay.querySelector("#aiSaveBtn")); });
    inp.addEventListener("input", () => { overlay.querySelector("#aiKeyStatus").textContent = ""; });
  }
}
// A wrong key shows an inline error and KEEPS what you typed, so you just fix it
// and hit Save again — no separate screen, no re-typing the whole key.
async function saveAiKey(btn) {
  const overlay = btn.closest(".catalog-overlay");
  const input = overlay.querySelector("#aiKeyInput");
  const status = overlay.querySelector("#aiKeyStatus");
  const setStatus = (m, c) => { status.textContent = m; status.style.color = c || "var(--muted, #8a94a6)"; };
  const key = (input.value || "").trim();
  const hasKey = cache.userSettings && cache.userSettings.classifier_api_key_set;
  if (!key && !hasKey) { setStatus("Please paste your API key.", "#ff6b6b"); input.focus(); return; }
  const orig = btn.textContent;
  btn.disabled = true; btn.textContent = "Checking…"; setStatus("Checking your key…", "");
  let r, b;
  try {
    r = await fetch("/settings/classifier", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(key ? { enabled: true, api_key: key } : { enabled: true }) });
    b = await r.json().catch(() => ({}));
  } catch (e) {
    setStatus("Couldn't reach GameGate — try again.", "#ff6b6b"); btn.disabled = false; btn.textContent = orig; return;
  }
  if (!r.ok) {
    // Rejected/invalid — keep the typed key so they just correct it and retry.
    setStatus(b.detail || "Couldn't save the key.", "#ff6b6b");
    btn.disabled = false; btn.textContent = orig; input.focus(); input.select();
    return;
  }
  const offline = b.note && b.note.toLowerCase().includes("couldn't");
  setStatus(offline ? b.note : "Connected ✓", offline ? "#e0b64a" : "var(--green, #2ee06f)");
  setTimeout(() => { overlay.remove(); refresh().then(route); }, 900);
}

// Phone Link setup walkthrough — 4 steps, no credential. Texts arrive as Windows
// notifications (Phone Link), which GameGate already captures; this just guides
// the one-time pairing and confirms the first text lands. Starts at `startStep`
// (Connect=1, Finish setup=2, Turn back on=4).
function showTextSyncWizard(startStep) {
  const overlay = document.createElement("div");
  overlay.className = "catalog-overlay";
  overlay.onclick = (e) => { if (e.target === overlay) close(); };
  document.body.appendChild(overlay);
  let phone = "android";          // "android" | "ios" — never persisted
  let pollTimer = null;
  let gen = 0;                    // bumped on every render/close; stale poll loops bail on mismatch
  const FOOTER = `Under the hood this uses Windows Phone Link — Microsoft's built-in phone↔PC sync. GameGate just reads the notifications it produces.`;
  const foot = `<div style="border-top:1px solid var(--line-soft,#2a2c33);margin-top:14px;padding-top:8px;color:var(--muted,#8a94a6);font-size:11.5px">${FOOTER}</div>`;
  const counter = (n) => `<span class="muted" style="float:right;font-size:12px">Step ${n} of 4</span>`;
  const close = () => { gen++; if (pollTimer) clearTimeout(pollTimer); overlay.remove(); };
  const box = () => overlay.querySelector(".catalog");

  function render(step) {
    gen++;  // invalidate any in-flight poll loop from the step we're leaving
    if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
    if (step === 1) return step1();
    if (step === 2) return step2();
    if (step === 3) return step3();
    if (step === 4) return step4();
  }

  function step1() {
    overlay.innerHTML = `<div class="catalog">
      <h2>Sync text messages</h2>
      <div class="muted" style="margin-bottom:12px">Texts are the messages people actually expect you to see. Pair your phone with Windows once, and every text lands in GameGate alongside your email and Discord — quiet while you're gaming, waiting for you in the recap.<br><br>There's nothing to sign into and no password to enter. Takes about two minutes.</div>
      <div style="font-weight:600;font-size:13.5px;margin-bottom:8px">Which phone do you have?</div>
      <div class="muted" style="font-size:12px;margin-bottom:12px">Android gets full text sync — read, and reply from Windows. iPhone works over Bluetooth and will show your texts, but Apple limits what other apps can do with them, so you'll get fewer of the extras. Either way, GameGate will see them.</div>
      <div class="row" style="justify-content:flex-end;gap:8px">
        <button class="btn" id="tsCancel">Cancel</button>
        <button class="btn" id="tsIphone">iPhone</button>
        <button class="btn green" id="tsAndroid">Android</button>
      </div>${foot}</div>`;
    box().querySelector("#tsCancel").onclick = close;
    box().querySelector("#tsIphone").onclick = () => { phone = "ios"; render(2); };
    box().querySelector("#tsAndroid").onclick = () => { phone = "android"; render(2); };
  }

  function step2() {
    const myGen = gen;
    const pairMsg = phone === "ios"
      ? `choose <b>iPhone</b>, pair over Bluetooth, and say yes when your iPhone asks to share notifications and messages`
      : `it'll show a QR code — scan it with your phone's camera and approve the permissions`;
    // Ask the PC whether Phone Link is actually installed BEFORE claiming it is.
    overlay.innerHTML = `<div class="catalog">
      <h2>Pair your phone with Windows ${counter(2)}</h2>
      <div id="tsBody" class="muted" style="margin-bottom:8px">Checking for Phone Link…</div>
      <div id="tsStatus" style="min-height:18px;margin-top:8px;font-size:13px"></div>
      <div class="row" id="tsBtns" style="justify-content:flex-end;gap:8px;margin-top:6px"></div>
      ${foot}</div>`;
    fetch("/system/phone-link-status").then((r) => r.json())
      .then((s) => { if (myGen === gen) fill(s.installed); })
      .catch(() => { if (myGen === gen) fill(null); });

    function fill(installed) {
      const body = box().querySelector("#tsBody");
      const btns = box().querySelector("#tsBtns");
      const back = `<button class="btn" id="tsBack">Back</button>`;
      const paired = `<button class="btn" id="tsPaired">I've already paired</button>`;
      if (installed === false) {
        body.innerHTML = `Phone Link isn't on this PC yet — it's a free Microsoft app. Get it from the Store (one click), install it, then come back here, open it, and ${pairMsg}.`;
        btns.innerHTML = back + paired + `<button class="btn green" id="tsGet">Get Phone Link</button>`;
        wireCommon();
        box().querySelector("#tsGet").onclick = async (e) => {
          await fetch("/system/get-phone-link", { method: "POST" }).catch(() => {});
          e.target.textContent = "Open Phone Link";
          e.target.onclick = openPL;
        };
      } else {
        body.innerHTML = installed === null
          ? `We'll open Phone Link (Microsoft's built-in phone sync). If it isn't installed, use <b>Get Phone Link</b> to grab it from the Store first — then ${pairMsg}.`
          : `Phone Link is on this PC. Open it, then ${pairMsg}.`;
        btns.innerHTML = back + paired
          + (installed === null ? `<button class="btn" id="tsGet">Get Phone Link</button>` : "")
          + `<button class="btn green" id="tsOpen">Open Phone Link</button>`;
        wireCommon();
        if (installed === null) {
          box().querySelector("#tsGet").onclick = () =>
            fetch("/system/get-phone-link", { method: "POST" }).catch(() => {});
        }
        box().querySelector("#tsOpen").onclick = openPL;
      }
      function wireCommon() {
        box().querySelector("#tsBack").onclick = () => render(1);
        box().querySelector("#tsPaired").onclick = () => render(3);
      }
      async function openPL(e) {
        const status = box().querySelector("#tsStatus");
        let ok = false;
        try {
          const r = await fetch("/system/open-phone-link", { method: "POST" });
          const b = await r.json().catch(() => ({}));
          ok = r.ok && b.launched !== false;
        } catch (_) { ok = false; }
        if (!ok) {
          status.textContent = `Couldn't open Phone Link automatically. Press the Windows key, type "Phone Link", and open it — or use Get Phone Link to install it first.`;
          status.style.color = "#ff6b6b";
        }
        e.target.textContent = "My phone is paired →";
        e.target.onclick = () => render(3);
      }
    }
  }

  function step3() {
    const iphoneNote = phone === "ios"
      ? `<div class="muted" style="font-size:12px;margin-top:10px">On iPhone, keep Bluetooth on and your phone nearby — that's the link. If the phone wanders off, texts pause until it's back.</div>`
      : "";
    overlay.innerHTML = `<div class="catalog">
      <h2>Let your texts through ${counter(3)}</h2>
      <div class="muted">In Phone Link, open <b>Settings → Features → Notifications</b> and switch on <b>Messages</b> and <b>Notifications</b>. Windows may also ask permission the first time a text arrives — say yes.<br><br>That's the whole handshake. Your texts become Windows notifications, and GameGate is already listening for those.</div>
      ${iphoneNote}
      <div class="row" style="justify-content:flex-end;gap:8px;margin-top:12px">
        <button class="btn" id="tsBack">Back</button>
        <button class="btn green" id="tsTest">Done — let's test it</button>
      </div>${foot}</div>`;
    box().querySelector("#tsBack").onclick = () => render(2);
    // Enabling happens on step 4 entry (so the "turn syncing back on" resume,
    // which jumps straight to step 4, also enables — not just this first-run path).
    box().querySelector("#tsTest").onclick = () => render(4);
  }

  function step4() {
    const myGen = gen;
    const deadline = Date.now() + 90000;
    let since = new Date().toISOString();  // fallback only if the baseline fetch fails
    // Turn syncing ON here (so BOTH the first-run path and the "turn back on"
    // resume — which jumps straight to step 4 — actually enable it), then take
    // the wait baseline from the SERVER clock so client/server skew can't hide a
    // genuinely new text. Start polling only once the baseline is in.
    fetch("/settings/text-sync", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ enabled: true }) });
    waiting();
    fetch("/connectors/text/probe")
      .then((r) => r.json()).then((b) => { if (b && b.now) since = b.now; })
      .catch(() => {})
      .finally(() => { if (myGen === gen) poll(); });

    function waiting() {
      overlay.innerHTML = `<div class="catalog">
        <h2>Send yourself a text ${counter(4)}</h2>
        <div class="muted">Grab your phone and text yourself anything — "hi" works. We'll watch for it.</div>
        <div id="tsStatus" style="min-height:18px;margin-top:12px;font-size:13px" class="muted">● Waiting for your first text…</div>
        <div class="row" style="justify-content:flex-end;gap:8px;margin-top:6px">
          <button class="btn" id="tsBack">Back</button>
          <button class="btn" id="tsSkip">Skip the test</button>
        </div>${foot}</div>`;
      box().querySelector("#tsBack").onclick = () => render(3);
      box().querySelector("#tsSkip").onclick = finishAnyway;
    }
    async function poll() {
      let captured = false;
      try {
        const r = await fetch(`/connectors/text/probe?since=${encodeURIComponent(since)}`);
        const b = await r.json().catch(() => ({}));
        captured = !!b.captured;
      } catch (_) { /* transient — keep polling */ }
      // If the user navigated away or closed the wizard while the fetch was in
      // flight, stop here — never re-arm a detached loop or paint a dead overlay.
      if (myGen !== gen || !overlay.isConnected) return;
      if (captured) return success();
      if (Date.now() > deadline) return timedOut();
      pollTimer = setTimeout(poll, 2000);
    }
    function success() {
      overlay.innerHTML = `<div class="catalog">
        <h2>Got it! ✓</h2>
        <div class="muted"><b>Your text just came through.</b> Your texts are syncing — from here on they'll be triaged with everything else, held quietly while you're in a game, and waiting in your recap when you're out.</div>
        <div class="row" style="justify-content:flex-end;margin-top:14px">
          <button class="btn green" id="tsDone">Done</button>
        </div>${foot}</div>`;
      box().querySelector("#tsDone").onclick = () => { close(); refresh().then(route); };
    }
    function timedOut() {
      overlay.innerHTML = `<div class="catalog">
        <h2>Send yourself a text ${counter(4)}</h2>
        <div id="tsStatus" style="font-size:13px;color:#e0b64a">Nothing yet. Double-check Phone Link shows your phone as connected, and that <b>Messages</b> is switched on under Notifications.</div>
        <div class="row" style="justify-content:flex-end;gap:8px;margin-top:12px">
          <button class="btn" id="tsBack">Back to the steps</button>
          <button class="btn green" id="tsAgain">Keep waiting</button>
          <button class="btn" id="tsFin">Finish anyway</button>
        </div>${foot}</div>`;
      box().querySelector("#tsBack").onclick = () => render(2);
      box().querySelector("#tsAgain").onclick = () => render(4);
      box().querySelector("#tsFin").onclick = finishAnyway;
    }
    function finishAnyway() { close(); refresh().then(route); }
  }

  render(startStep || 1);
}
function showCatalog() {
  const c = cache.connections;
  const overlay = document.createElement("div");
  overlay.className = "catalog-overlay";
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  overlay.innerHTML = `<div class="catalog"><h2>Add a connector</h2>` +
    (c ? c.catalog.map(item => `
      <div class="card click row" onclick="this.closest('.catalog-overlay').remove();connAction('${item.id}','connect')">
        <div><div style="font-weight:600">${esc(item.name)}</div><div class="muted">${esc(item.desc)}</div></div>
      </div>`).join("") : "") + `</div>`;
  document.body.appendChild(overlay);
}

function route() {
  const hash = location.hash || "#/recaps";
  const [, name, arg] = hash.split("/");
  const def = NAVDEF.find(n => n.route === (name === "recap" ? "recaps" : name)) || NAVDEF[0];
  if (name === "recap") {
    const d = cache.recaps.find(x => x.id === arg);
    const game = d && d.session ? (d.session.application || "Recap") : "Recap";
    document.querySelector("#page-title").innerHTML =
      `<a href="#/recaps" class="back" style="margin:0 6px 0 0">${I.back}</a>` +
      `<span class="crumb">Game Recaps /</span> ${esc(game)}`;
    document.title = game + " · GameGate";
  } else {
    document.querySelector("#page-title").innerHTML = def.title;
    document.title = def.title + " · GameGate";
  }
  renderNav();
  view.innerHTML = (views[name] || views.recaps)(arg);
}

window.addEventListener("hashchange", route);
(async () => { await refresh(); route(); })();
setInterval(async () => {
  await refresh();
  // Don't rebuild the view (which wipes it via innerHTML) while the user is
  // actively TYPING in a field — that ate in-progress VIP/keyword input (M8).
  // NOTE: this used to treat ANY focused element in #view as "editing", but in
  // WebView2 a clicked <button> keeps focus — so after you clicked anything
  // (a filter chip, a Read button), the 15s refresh stopped re-rendering and a
  // newly-arrived message never appeared or became clickable until you reopened
  // the app. Scope it to real text inputs so the list keeps refreshing.
  const ae = document.activeElement;
  const typing = ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA")
    && ae.closest && ae.closest("#view");
  if (!location.hash.startsWith("#/recap/") && !typing) route();
}, 15000);
</script>
</body>
